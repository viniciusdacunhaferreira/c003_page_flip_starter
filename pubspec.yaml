name: page_flip
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  vector_graphics: ^1.1.11+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  vector_graphics_compiler: ^1.1.11+1

flutter:
  uses-material-design: true
  assets:
    - path: assets/forest-day.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/forest-night.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/man.svg
      transformers:
        - package: vector_graphics_compiler
